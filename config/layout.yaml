  - { shelf_id: B3, zone: B, x: 12.2, y: 10.5, w: 2.0, h: 1.2, scan_x: 13.2, scan_y: 10.0,
      products: { Coffee Jar: 8 } }
  - { shelf_id: B4, zone: B, x: 9.8,  y: 10.5, w: 2.0, h: 1.2, scan_x: 10.8, scan_y: 10.0,
      products: { Tea Pack: 12 } }
  - { shelf_id: B5, zone: B, x: 7.4,  y: 10.5, w: 2.0, h: 1.2, scan_x: 8.4,  scan_y: 10.0,
      products: { Rice Bag: 10 } }
  - { shelf_id: B6, zone: B, x: 5.0,  y: 10.5, w: 2.0, h: 1.2, scan_x: 6.0,  scan_y: 10.0,
      products: { Cooking Oil: 12 } }
